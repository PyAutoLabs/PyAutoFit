[build-system]
requires = ["setuptools>=79.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autofit"
dynamic = ["version"]
description = "Classy Probabilistic Programming"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "James Nightingale", email = "James.Nightingale@newcastle.ac.uk" },
    { name = "Richard Hayes", email = "richard@rghsoftware.co.uk" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
keywords = ["cli"]
dependencies = [
    # Floor, not a pin (PyAutoLens#687) — bump to the first release with JAX
    # in autonerves' base dependencies once it exists (PyAutoLens#702), so
    # backtracking cannot pair this autofit with a jax-optional autonerves.
    "autonerves>=2026.7.29.2",
    # JAX-native gradient MAP searches (MultiStartAdam / MultiStartProdigy)
    # import optax; jax itself comes from autonerves' base deps. Both are
    # marker-gated for platforms with no jax wheels (Intel macOS) — optax
    # depends on jax, so an unmarked optax would break resolution there.
    # PyAutoLens#702.
    'optax>=0.2.5; sys_platform != "darwin" or platform_machine == "arm64"',
    "array_api_compat",
    "anesthetic>=2.9.0",
    "corner==2.2.2",
    "decorator>=4.2.1",
    "dill>=0.3.1.1",
    "dynesty==2.1.5",
    "typing-inspect>=0.4.0",
    "emcee>=3.1.6",
    "gprof2dot==2021.2.21",
    "matplotlib",
    "numpydoc>=1.0.0",

    "h5py>=3.11.0",
    "SQLAlchemy>=2.0.32,<2.1.0",
    "scipy<=1.17.1",
    "astunparse==1.6.3",
    "threadpoolctl>=3.1.0",
    "timeout-decorator==0.5.0",
    "xxhash<=3.4.1",
    "networkx==3.1",
    "pyvis==0.3.2",
    "psutil==6.1.0"
]

[project.urls]
Homepage = "https://github.com/PyAutoLabs/PyAutoFit"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["docs", "test_autofit", "test_autofit*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"


[project.optional-dependencies]
# JAX moved into the base dependencies (PyAutoLens#702). Kept as a declared
# no-op so `pip install autofit[jax]` keeps resolving (PyAutoLens#687).
jax = []
mcp = ["mcp"]
optional = [
    "autofit[jax]",
    "astropy>=5.0",
    "blackjax>=1.6.2",
    "getdist==1.4",
    "nautilus-sampler==1.0.5",
    "zeus-mcmc==2.5.4",
]
docs=[
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx_copybutton",
    "sphinx_design",
    "sphinx_inline_tabs",
    "sphinx_autodoc_typehints"
]

test = ["pytest"]
dev = ["pytest", "black"]

[tool.setuptools.package-data]
"autofit.config" = ["*"]

[tool.pytest.ini_options]
testpaths = ["test_autofit"]
filterwarnings = [
    "ignore:cuda_plugin_extension:UserWarning",
    "ignore::DeprecationWarning:jax",
    "ignore:relationship .* will copy column:sqlalchemy.exc.SAWarning",
]
