name: Docs

# Docs build check is defined once, centrally, in PyAutoHeart's reusable
# workflow (Heart owns all health/readiness checking). This thin caller
# builds the Sphinx docs on PRs and fails on warning-count regression
# against docs/sphinx_warning_baseline.txt.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "autofit/**"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "autofit/**"
      - "pyproject.toml"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  docs:
    uses: PyAutoLabs/PyAutoHeart/.github/workflows/docs-build.yml@main
    with:
      package: autofit
    secrets: inherit

  # The search pages (docs/api/searches.rst, docs/searches/index.rst and
  # docs/searches/citations.rst) are generated from the search manifest
  # (python -m autofit search-manifest --json); fail when they are stale.
  generated-search-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install autofit
        run: pip install -e .
      - name: Check the generated search docs
        run: python docs/_generate_searches.py --check
