# The notation configs define the labels of every model parameter which are used when
# visualizing results (for example labeling the axis of the PDF triangle plots output by a non-linear search).


# label: The label given to the each parameter, for plots like PDF corner plots.

# For example, if `centre=x`, the plot axis will be labeled 'x'.


# superscript: the superscript used on certain plots that show the results of different model-components.

# For example, if `Gaussian=g`, plots where the parameters of the Gaussian model-component have superscript `g`.

label:
  label:
    centre: x # Plot label used for the centre parameter.
    normalization: norm # Plot label used for the normalization parameter.
    parameter0: a # Plot label used for the parameter0 parameter.
    parameter1: b # Plot label used for the parameter1 parameter.
    parameter2: c # Plot label used for the parameter2 parameter.
    rate: \lambda # Plot label used for the rate parameter.
    sigma: \sigma # Plot label used for the sigma parameter.
  superscript:
    Exponential: e # Class suffix for an unnamed Exponential Model; named components use component paths.
    Gaussian: g # Class suffix for an unnamed Gaussian Model; named components use component paths.
    ModelComponent0: M0 # Class suffix for an unnamed ModelComponent0 Model; named components use component paths.
    ModelComponent1: M1 # Class suffix for an unnamed ModelComponent1 Model; named components use component paths.

# label_format: The format certain parameters are output as in output files like the `model.results` file.

# For example, if `centre={:.2d}`, the format of the centre parameter in results files will use this Python format.

label_format:
  format:
    centre: '{:.2f}' # Python format string used for centre in result summaries.
    normalization: '{:.2f}' # Python format string used for normalization in result summaries.
    parameter0: '{:.2f}' # Python format string used for parameter0 in result summaries.
    parameter1: '{:.2f}' # Python format string used for parameter1 in result summaries.
    parameter2: '{:.2f}' # Python format string used for parameter2 in result summaries.
    rate: '{:.2f}' # Python format string used for rate in result summaries.
    sigma: '{:.2f}' # Python format string used for sigma in result summaries.
